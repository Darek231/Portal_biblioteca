{% extends "base.html" %}

{% block titulo %}Portal de Biblioteca{% endblock %}

{% block contenido %}
<h1>Portal de Biblioteca</h1>

{% if ultimo_usuario %}
    <p>Último usuario registrado: {{ ultimo_usuario }}.</p>

{% else %}

{% endif %}
{% endblock %}
